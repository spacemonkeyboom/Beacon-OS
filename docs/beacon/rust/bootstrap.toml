# Beacon: host toolchain (Linux x86_64) that can build for riscv64 Haiku
change-id = "ignore"
profile = "dist"

[llvm]
download-ci-llvm = true

[build]
host = ["x86_64-unknown-linux-gnu"]
target = ["x86_64-unknown-linux-gnu", "riscv64gc-unknown-haiku"]
extended = true
tools = ["cargo", "src"]
jobs = 3
docs = false

[install]
prefix = "$HOME/beacon/rust/toolchain"

[rust]
channel = "stable"
lld = false

[target.riscv64gc-unknown-haiku]
cc = "$HOME/beacon/rust/riscv64-haiku-gcc"
cxx = "$HOME/beacon/rust/riscv64-haiku-g++"
ar = "$HOME/beacon/haiku/generated.riscv64/cross-tools-riscv64/bin/riscv64-unknown-haiku-ar"
linker = "$HOME/beacon/rust/riscv64-haiku-cc"
